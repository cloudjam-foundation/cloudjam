name: Feature Request
description: Request a feature that improves CloudJam
title: 'Feat: '
type: 'Feature'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill this out to request a feature!

        **Before you start:**
        Please check if the issue has already been suggested by searching [existing issues](https://github.com/cloudjam-foundation/cloudjam/issues).

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: A clear and concise description of what the feature is.
      placeholder: I'd like is so that...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help showcase your feature.
      placeholder: Paste screenshots here...
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the feature here.
      placeholder: Any other relevant information...
    validations:
      required: false