syntax = "proto3";

package v1.admin;

import "buf/validate/validate.proto";

option go_package = "codeberg.org/megakuul/cloudjam/pkg/api/v1/admin";

enum Feature {
  VisualJam = 0;
  VisualLeaderboard = 1;
  VisualHost = 2;
  VisualProvider = 3;
  VisualAdmin = 4;
}

message Role {
  string scope = 1;
  string id = 2;
  string name = 3 [
    (buf.validate.field).string.min_len = 4,
    (buf.validate.field).string.max_len = 20
  ];
  string description = 4 [
    (buf.validate.field).string.min_len = 0,
    (buf.validate.field).string.max_len = 50
  ];
  bool builtin = 5;
  map<string, string> permissions = 6 [
    (buf.validate.field).map.min_pairs = 1,
    (buf.validate.field).map.max_pairs = 20,
    (buf.validate.field).map.values.string = {
      min_len: 1
      max_len: 100
      pattern: "^[a-zA-Z0-9,*/.]+$"
    }
  ];
  repeated Feature features = 7;
}
