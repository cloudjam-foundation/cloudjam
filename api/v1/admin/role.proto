syntax = "proto3";

package v1.admin;

import "buf/validate/validate.proto";

option go_package = "codeberg.org/megakuul/cloudjam/pkg/api/v1/admin";

enum Feature {
  // Lets users see the jam section on the front-end
  VisualJam = 0;

  // Let users see the leaderboard section on the front-end
  VisualLeaderboard = 1;

  // Let users see the host section on the front-end
  VisualHost = 2;

  // Let users see the provider section on the front-end
  VisualProvider = 3;

  // Let users see the admin section on the front-end
  VisualAdmin = 4;
}

message Role {
  string scope = 1;
  string id = 2;
  string name = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 30
  ];
  string description = 4 [
    (buf.validate.field).string.min_len = 0,
    (buf.validate.field).string.max_len = 50
  ];
  bool builtin = 5;
  map<string, string> permissions = 6 [
    (buf.validate.field).map.min_pairs = 0,
    (buf.validate.field).map.max_pairs = 20,
    (buf.validate.field).map.values.string = {
      min_len: 1
      max_len: 100
      pattern: "^[a-zA-Z0-9,*/.]+$"
    }
  ];
  repeated Feature features = 7;
}
