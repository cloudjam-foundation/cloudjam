syntax = "proto3";

package v1.play;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "codeberg.org/megakuul/cloudjam/pkg/api/v1/play";

message Game {
  string scope = 1;
  string id = 2 [(buf.validate.field).string = {uuid: true}];
  string name = 3 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 100
  ];
  string description = 4 [
    (buf.validate.field).string.min_len = 0,
    (buf.validate.field).string.max_len = 200
  ];
  google.protobuf.Timestamp from = 5 [(buf.validate.field).cel = {
    id: "game.from.not_past"
    message: "must not be more than 1 minute in the past"
    expression: "this > now - duration('60s')"
  }];
  google.protobuf.Timestamp to = 6 [(buf.validate.field).timestamp.gt_now = true];

  option (buf.validate.message).cel = {
    id: "timestamp_overlap"
    message: "game timeframe must not overlap"
    expression: "this.from < this.to"
  };
}
