<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f5faf8"/>
  <style>
    .box { fill: #ffffff; stroke: #27544a; stroke-width: 3; rx: 16; }
    .service { font: 700 20px sans-serif; fill: #173b34; text-anchor: middle; }
    .detail { font: 15px sans-serif; fill: #52736c; text-anchor: middle; }
    .arrow { fill: none; stroke: #e48a3a; stroke-width: 5; marker-end: url(#arrow); }
    .lane { fill: none; stroke: #a8c9c0; stroke-width: 2; stroke-dasharray: 8 8; rx: 24; }
    .label { font: 700 16px sans-serif; fill: #52736c; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e48a3a"/>
    </marker>
  </defs>

  <text x="50" y="42" class="label">Field access</text>
  <text x="430" y="42" class="label">Managed telemetry</text>
  <text x="850" y="42" class="label">Analytical lake</text>
  <rect x="30" y="60" width="340" height="420" class="lane"/>
  <rect x="400" y="60" width="390" height="420" class="lane"/>
  <rect x="820" y="60" width="350" height="420" class="lane"/>

  <rect x="55" y="115" width="125" height="90" class="box"/>
  <text x="117" y="150" class="service">Sensors</text>
  <text x="117" y="178" class="detail">observation JSON</text>

  <rect x="220" y="115" width="125" height="90" class="box"/>
  <text x="282" y="150" class="service">App Runner</text>
  <text x="282" y="178" class="detail">Go container API</text>

  <rect x="105" y="320" width="190" height="90" class="box"/>
  <text x="200" y="355" class="service">AWS AppConfig</text>
  <text x="200" y="383" class="detail">deployed limits</text>

  <rect x="430" y="115" width="145" height="90" class="box"/>
  <text x="502" y="150" class="service">IoT Core</text>
  <text x="502" y="178" class="detail">topic rule</text>

  <rect x="620" y="115" width="140" height="90" class="box"/>
  <text x="690" y="150" class="service">Firehose</text>
  <text x="690" y="178" class="detail">direct put</text>

  <rect x="455" y="320" width="280" height="90" class="box"/>
  <text x="595" y="355" class="service">CloudWatch</text>
  <text x="595" y="383" class="detail">errors, alarm, dashboard</text>

  <rect x="850" y="115" width="125" height="90" class="box"/>
  <text x="912" y="150" class="service">Amazon S3</text>
  <text x="912" y="178" class="detail">Parquet lake</text>

  <rect x="1010" y="115" width="125" height="90" class="box"/>
  <text x="1072" y="150" class="service">AWS Glue</text>
  <text x="1072" y="178" class="detail">data catalog</text>

  <rect x="930" y="320" width="135" height="90" class="box"/>
  <text x="997" y="355" class="service">Athena</text>
  <text x="997" y="383" class="detail">query result</text>

  <path d="M180 160 H220" class="arrow"/>
  <path d="M295 365 H330 V205" class="arrow"/>
  <path d="M345 160 H430" class="arrow"/>
  <path d="M575 160 H620" class="arrow"/>
  <path d="M760 160 H850" class="arrow"/>
  <path d="M975 160 H1010" class="arrow"/>
  <path d="M1072 205 V270 H997 V320" class="arrow"/>
  <path d="M930 365 H360 V205" class="arrow"/>
  <path d="M595 320 V205" class="arrow"/>
</svg>
