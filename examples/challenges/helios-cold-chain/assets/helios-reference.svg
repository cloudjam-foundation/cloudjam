<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#f7f9fc"/>
  <style>
    .box { fill: #ffffff; stroke: #30445f; stroke-width: 3; rx: 16; }
    .service { font: 700 20px sans-serif; fill: #17263a; text-anchor: middle; }
    .detail { font: 15px sans-serif; fill: #52657d; text-anchor: middle; }
    .arrow { fill: none; stroke: #ff8a3d; stroke-width: 5; marker-end: url(#arrow); }
    .lane { fill: none; stroke: #aec1d8; stroke-width: 2; stroke-dasharray: 8 8; rx: 24; }
    .label { font: 700 16px sans-serif; fill: #52657d; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a3d"/>
    </marker>
  </defs>

  <text x="48" y="42" class="label">Public ingestion</text>
